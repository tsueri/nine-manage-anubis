[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nine-manage-anubis"
version = "0.1.0"
description = "CLI for managing Anubis bot protection on nine.ch Managed Servers"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
nine-manage-anubis = "nine_manage_anubis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
