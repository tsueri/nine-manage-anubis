[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nine-manage-anubis"
version = "0.1.0"
description = "CLI for managing Anubis bot protection on nine.ch Managed Servers"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
nine-manage-anubis = "nine_manage_anubis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The package is fully annotated and mypy-clean, and the marker is what lets
# anything importing it — including this repo's own test suite — see that
# rather than treat it as untyped.
[tool.setuptools.package-data]
nine_manage_anubis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
